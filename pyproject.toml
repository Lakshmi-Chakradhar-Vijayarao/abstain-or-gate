[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abstaingate"
version = "0.1.0"
description = "Is it better to train abstention into a model, gate it at runtime, or both? QLoRA SFT -> DPO vs a calibrated release gate."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Lakshmi Chakradhar Vijayarao"}]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
train = ["torch>=2.2", "transformers>=4.46", "trl>=1.0", "peft>=0.13", "datasets>=2.20", "bitsandbytes>=0.43; platform_system == 'Linux'"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 135

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "trl.*", "peft.*", "datasets.*", "gatedrag.*"]
follow_imports = "skip"
